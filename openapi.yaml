openapi: 3.1.0
info:
  title: Persistio API
  version: 0.2.0
  description: Self-hosted memory service for AI agents.
servers:
  - url: http://localhost:4827
paths:
  /health:
    get:
      summary: Health probe
      description: |
        Returns service health including a live database ping.
        If `HEALTH_API_KEY` is set on the server, requests must include the header
        `X-Health-Key: <HEALTH_API_KEY>`. If the env var is unset, the endpoint is
        unauthenticated (dev/test only).
      parameters:
        - in: header
          name: X-Health-Key
          required: false
          schema:
            type: string
          description: Required when `HEALTH_API_KEY` is configured on the server.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    description: Overall health status.
                  version:
                    type: string
                    description: Server version.
                  db:
                    type: string
                    enum: [ok, degraded]
                    description: Database connectivity status.
                  db_latency_ms:
                    type: integer
                    description: Measured latency of the database ping in milliseconds.
                  extraction_queue_depth:
                    type:
                      - integer
                      - 'null'
                    description: Number of entries currently in the extraction queue.
                  curation_queue_depth:
                    type:
                      - integer
                      - 'null'
                    description: Number of entries currently in the curation queue.
                  uptime_s:
                    type: integer
                    description: Process uptime in whole seconds.
              example:
                status: ok
                version: 0.2.0
                db: ok
                db_latency_ms: 12
                extraction_queue_depth: 2
                curation_queue_depth: 1
                uptime_s: 34
        '503':
          description: Service is degraded (database check failed or timed out)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  version:
                    type: string
                  db:
                    type: string
                    enum: [degraded]
                  db_latency_ms:
                    type: integer
                  extraction_queue_depth:
                    type: 'null'
                  curation_queue_depth:
                    type: 'null'
                  uptime_s:
                    type: integer
              example:
                status: degraded
                version: 0.2.0
                db: degraded
                db_latency_ms: 2001
                extraction_queue_depth: null
                curation_queue_depth: null
                uptime_s: 120
  /v1/ingest:
    post:
      summary: Append raw conversation chunks
      description: |
        Appends raw conversation chunks for extraction. Each chunk must include
        the original conversation turn timestamp as an ISO 8601 datetime with
        UTC `Z` or an explicit offset. The
        live OpenClaw plugin supplies this automatically; custom clients and
        backfill tools must provide it explicitly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, chunks]
              properties:
                session_id:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Context identity. Control characters are rejected before trimming; must remain non-empty after trimming. Invalid identities return 400 before ingest side effects.
                context:
                  $ref: '#/components/schemas/IngestContext'
                chunks:
                  type: array
                  items:
                    $ref: '#/components/schemas/IngestChunk'
      responses:
        '202':
          description: Chunks accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestReceipt'
  /v1/ingest/bulk:
    post:
      summary: Bulk append raw conversation chunks
      description: |
        Premium backfill/import endpoint. Accepts up to 2048 chunks, writes raw
        chunks with one multi-row insert, and queues extraction at bulk priority.
        Request bodies are accepted up to `BULK_INGEST_BODY_LIMIT_BYTES`
        bytes, 25 MiB by default.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, chunks]
              properties:
                session_id:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Same identity contract as normal ingest; controls rejected before trimming.
                context:
                  $ref: '#/components/schemas/IngestContext'
                chunks:
                  type: array
                  maxItems: 2048
                  items:
                    $ref: '#/components/schemas/IngestChunk'
      responses:
        '202':
          description: Chunks accepted and extraction job queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/IngestReceipt'
                  - type: object
                    properties:
                      job_id:
                        type: string
                        format: uuid
                        description: Present when an extraction job was queued.
        '403':
          description: Bulk ingest requires a premium plan
        '413':
          description: Too many chunks
  /v1/recall:
    post:
      summary: Return relevant memory or a complete server-prepared context bundle
      description: All plans recall active baseline memories. Premium Curator improves those same memories independently. No client ACK or delivery ledger exists. Logs contain bounded request metadata, never returned memory content.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [bundle_v3]
          description: Omit for structured JSON. Legacy bundle and bundle_v2 formats are not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 32768
                  pattern: '\S'
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 100
                min_similarity:
                  type: number
                  minimum: 0
                  maximum: 1
                include_raw:
                  type: boolean
                  default: false
                  description: Requires context.session_id and default JSON format. Reads only owned readable exact-context sources ranked by semantic similarity. Raw and evidence lists share one top_k cap and 64 KiB decoded source budget, separate from the memory-result cap.
                include_evidence:
                  type: boolean
                  default: false
                  description: Same session/context and JSON-only restrictions as include_raw. Eligible supporting sources of returned memories take priority over raw matches before the shared top_k cap; evidence does not require its own embedding. Count and byte limits may omit sources.
                include_related:
                  type: boolean
                  default: true
                  description: Graph expansion requires Curator entitlement; all lanes share top_k.
                max_bundle_bytes:
                  type: integer
                  minimum: 0
                  maximum: 65536
                  default: 1200
                  description: Maximum UTF-8 bytes of the complete decoded bundle, not model tokens or HTTP JSON bytes. Whole records only; insufficient space returns an empty bundle.
                context:
                  $ref: '#/components/schemas/MemoryContext'
                mode:
                  type: string
                  enum: [agent, factual]
                  default: agent
                client:
                  $ref: '#/components/schemas/RecallClient'
      responses:
        '200':
          description: Relevant memory JSON or ready-to-use bundle
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecallJsonResponse'
                  - $ref: '#/components/schemas/RecallBundleResponse'
        '400':
          description: Invalid request, unsupported format, or invalid source retrieval combination
        '401':
          description: Unauthorized
        '429':
          description: Search quota exceeded
        '500':
          description: Recall failed
  /stats:
    get:
      summary: Fetch vault plan, quota, and usage stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vault stats
  /v1/curation:
    get:
      summary: Fetch live Curator capacity, queue, and usage state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Curator capacity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationStatus'
  /v1/memories:
    get:
      summary: List memories
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
            default: false
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, high-confidence, low-confidence, positive, negative]
            default: all
        - in: query
          name: include_children
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, oldest, confidence, salience]
            default: recent
        - in: query
          name: subject
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        '200':
          description: Paginated memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
    post:
      summary: Create a memory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, subject, scope]
              additionalProperties: false
              properties:
                data:
                  type: string
                  minLength: 1
                  maxLength: 10000
                subject:
                  type: string
                  minLength: 1
                  maxLength: 500
                categories:
                  type: array
                  items:
                    type: string
                    minLength: 1
                parent_id:
                  type: [string, 'null']
                  format: uuid
                type:
                  type: string
                  enum: [user_preference, user_rule, task_pattern, workflow, project, constraint, decision, system_fact, domain_knowledge]
                  default: system_fact
                scope:
                  type: string
                  enum: [global, project, task, session]
                scope_key:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 512
                  description: Must be null for global scope and is required for project, task, and session scopes.
                evidence:
                  type: string
                volatility:
                  type: string
                  enum: [very_low, low, medium, high]
                  default: low
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Invalid payload, including a missing or unsupported scope
  /v1/memories/subjects:
    get:
      summary: List memory subjects
      description: Returns subject summaries for visible active memories.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: sort
          schema:
            type: string
            enum: [count, recent, name]
            default: count
      responses:
        '200':
          description: Paginated memory subject summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [subject, count, latest_at]
                      properties:
                        subject:
                          type: string
                        count:
                          type: integer
                        latest_at:
                          type:
                            - string
                            - 'null'
                          format: date-time
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
        '401':
          description: Unauthorized
  /v1/memories/graph:
    get:
      summary: Fetch a bounded live memory graph
      description: Returns visible memory nodes and relationship edges for vault graph visualisation.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: seed_memory_id
          required: false
          schema:
            type: string
            format: uuid
          description: Optional visible memory id to expand from.
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 4
            default: 1
          description: Neighborhood expansion depth from the seed memory.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of nodes to return.
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum: [out, in, both]
            default: both
          description: Direction to traverse from the seed memory.
        - in: query
          name: edge_types
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MemoryEdgeType'
          style: form
          explode: false
          description: Optional comma-separated edge type filter.
      responses:
        '200':
          description: Bounded memory graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryGraph'
        '400':
          description: Invalid graph query
        '401':
          description: Unauthorized
        '404':
          description: Seed memory not found
  /v1/memories/{id}:
    get:
      summary: Fetch one memory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          description: Memory not found
    patch:
      summary: Update a memory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              anyOf:
                - required: [data]
                - required: [subject]
                - required: [categories]
                - required: [confidence]
                - required: [type]
                - required: [scope]
                - required: [scope_key]
                - required: [evidence]
                - required: [archived]
              additionalProperties: false
              properties:
                data:
                  type: string
                  minLength: 1
                  maxLength: 10000
                subject:
                  type: string
                  minLength: 1
                  maxLength: 500
                categories:
                  type: array
                  items:
                    type: string
                    minLength: 1
                confidence:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                type:
                  type: string
                  enum: [user_preference, user_rule, task_pattern, workflow, project, constraint, decision, system_fact, domain_knowledge]
                scope:
                  type: string
                  enum: [global, project, task, session]
                scope_key:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 512
                scope_change_reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Required for any change to scope or scope_key; this is mutation attribution, not approval. Changing to a different non-global scope also requires an explicitly supplied scope_key, even if its text matches the old binding. A transition to global requires an omitted or null key.
                evidence:
                  type: [string, 'null']
                archived:
                  type: boolean
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Invalid payload or scope/binding change without a reason
        '409':
          description: Stored memory has an invalid legacy scope or changed concurrently
        '404':
          description: Memory not found
    delete:
      summary: Archive a memory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory archived
        '404':
          description: Memory not found
  /v1/extract:
    post:
      summary: Trigger extraction
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Extraction job queued
  /v1/jobs/{id}:
    get:
      summary: Check extraction job status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
        '404':
          description: Job not found
  /admin/vaults:
    get:
      summary: List vaults
      security:
        - adminKey: []
      responses:
        '200':
          description: Vault list
    post:
      summary: Create a vault
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                purpose:
                  type: string
                  minLength: 1
                  maxLength: 500
                plan:
                  type: string
                  enum: [free, unlimited]
      responses:
        '201':
          description: Vault created
  /admin/vaults/{id}:
    get:
      summary: Get vault detail without key material
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault detail
        '404':
          description: Vault not found
    patch:
      summary: Update a vault
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                purpose:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 500
                plan:
                  type: string
                  enum: [free, unlimited]
      responses:
        '200':
          description: Vault updated
        '404':
          description: Vault not found
    delete:
      summary: Delete a vault
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault deleted
        '404':
          description: Vault not found
  /admin/vaults/{id}/rotate-key:
    post:
      summary: Rotate a vault API key
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault key rotated
        '404':
          description: Vault not found
  /admin/vaults/{id}/curation:
    get:
      summary: Fetch staff Curator capacity, queue, and usage state for a vault
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Curator capacity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationStatus'
        '404':
          description: Vault not found
  /admin/vaults/{id}/memories:
    get:
      summary: List memories for trusted review
      description: Lists vault memories for an authorized platform administrator. There is no pending-memory approval workflow.
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: archived
          schema:
            type: boolean
            default: false
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, high-confidence, low-confidence, positive, negative]
            default: all
        - in: query
          name: include_children
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, oldest, confidence, salience]
            default: recent
        - in: query
          name: subject
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        '200':
          description: Paginated vault memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
        '401':
          description: Unauthorized
        '404':
          description: Vault not found
components:
  schemas:
    IngestReceipt:
      type: object
      required: [accepted, inserted, replayed, chunks]
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Equals inserted plus replayed.
        inserted:
          type: integer
          minimum: 0
        replayed:
          type: integer
          minimum: 0
        chunks:
          type: array
          description: One outcome per input chunk, in request order.
          items:
            type: object
            required: [id, created_at, outcome]
            properties:
              id:
                type: string
                format: uuid
              created_at:
                type: string
                format: date-time
              outcome:
                type: string
                enum: [inserted, replayed]
    ProvenanceIdentity:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^(?=.*\S)[^\x00-\x1f\x7f-\x9f\uD800-\uDFFF]+$'
      description: Unicode code-point length and controls are checked before trimming; must remain non-empty after trimming.
    IngestTimestamp:
      type: string
      maxLength: 64
      format: date-time
      pattern: '^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$'
      description: Original event time. RFC 3339 subset requiring uppercase T/Z, seconds and colon-separated offsets; leap seconds are not supported. Future chunk timestamps beyond configured tolerance are rejected.
    ProvenanceActor:
      type: string
      enum: [human, assistant, agent, tool, system, import, unknown]
    ProvenanceAuthorship:
      type: string
      enum: [original, generated, transcribed, imported, mixed, unknown]
    SourceEvent:
      type: object
      additionalProperties: false
      required: [namespace, id]
      description: Vault-scoped replay identity. Namespace, ID and ordinal must be unique within a request; reusing a persisted key with different role or content returns 409. Message ID is metadata, not the replay key.
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^(?=.*\S)[^\x00-\x1f\x7f-\x9f\uD800-\uDFFF]+$'
          description: Unicode code-point length and controls are checked before trimming; must remain non-empty after trimming.
        id:
          $ref: '#/components/schemas/ProvenanceIdentity'
        message_id:
          $ref: '#/components/schemas/ProvenanceIdentity'
        ordinal:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
    CaptureProvenance:
      type: object
      additionalProperties: false
      required: [actor_type, trigger_type, artifact_type, authorship, cadence]
      properties:
        source_class:
          type: string
          enum: [agent_cron, agent_hook, agent_slack, agent_subagent, agent_other, thread_conversation, direct_or_import, unknown]
        actor_type:
          $ref: '#/components/schemas/ProvenanceActor'
        trigger_type:
          type: string
          enum: [direct, delegated, scheduled, event, backfill, api, unknown]
        artifact_type:
          type: string
          enum: [message, conversation, tool_result, status, observation, log, summary, document, unknown]
        authorship:
          $ref: '#/components/schemas/ProvenanceAuthorship'
        cadence:
          type: string
          enum: [one_off, recurring, batch, unknown]
        provenance_confidence:
          type: number
          minimum: 0
          maximum: 1
        provenance_basis:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [session_id_prefix, agent_trigger, integration_marker, thread_session_shape, session_id_shape, role_counts, plugin_capture, api_provenance, api_provenance_aggregate, transport_envelope, fallback]
        payload_author:
          type: object
          additionalProperties: false
          required: [actor_type, authorship, is_user]
          properties:
            actor_type:
              $ref: '#/components/schemas/ProvenanceActor'
            authorship:
              $ref: '#/components/schemas/ProvenanceAuthorship'
            is_user:
              type: [boolean, 'null']
        transport:
          type: object
          additionalProperties: false
          required: [initiator_actor_type, receiver_actor_type]
          properties:
            initiator_actor_type:
              $ref: '#/components/schemas/ProvenanceActor'
            receiver_actor_type:
              $ref: '#/components/schemas/ProvenanceActor'
            initiator_id:
              $ref: '#/components/schemas/ProvenanceIdentity'
            receiver_id:
              $ref: '#/components/schemas/ProvenanceIdentity'
            source_session_id:
              $ref: '#/components/schemas/ProvenanceIdentity'
            source_channel:
              $ref: '#/components/schemas/ProvenanceIdentity'
            source_tool:
              $ref: '#/components/schemas/ProvenanceIdentity'
        import:
          type: object
          additionalProperties: false
          required: [importer, importer_version, dataset_sha256, import_job_id, original_timestamp]
          properties:
            importer:
              $ref: '#/components/schemas/ProvenanceIdentity'
            importer_version:
              $ref: '#/components/schemas/ProvenanceIdentity'
            dataset_sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            import_job_id:
              $ref: '#/components/schemas/ProvenanceIdentity'
            original_timestamp:
              $ref: '#/components/schemas/IngestTimestamp'
    IngestChunk:
      type: object
      required: [role, content, timestamp]
      properties:
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
          minLength: 1
          description: Runtime-configured character and embedding-token limits apply (413 when exceeded).
        timestamp:
          $ref: '#/components/schemas/IngestTimestamp'
        source_event:
          $ref: '#/components/schemas/SourceEvent'
        provenance:
          $ref: '#/components/schemas/CaptureProvenance'
    IngestContext:
      type: object
      description: Identities are at most 512 characters before trimming, reject control characters, and must remain non-empty after trimming.
      additionalProperties: false
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 512
        task_id:
          type: string
          minLength: 1
          maxLength: 512
        agent_id:
          type: string
          minLength: 1
          maxLength: 512
        trigger_type:
          type: string
          enum: [direct, delegated, scheduled, event, backfill, api, unknown]
    MemoryContext:
      type: object
      description: Uses the same identity validation and normalization as ingest session IDs and memory scope keys.
      additionalProperties: false
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 512
        project_id:
          type: string
          minLength: 1
          maxLength: 512
        task_id:
          type: string
          minLength: 1
          maxLength: 512
        agent_id:
          type: string
          minLength: 1
          maxLength: 512
        trigger_type:
          type: string
          enum: [direct, delegated, scheduled, event, backfill, api, unknown]
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        data:
          type: string
        categories:
          type: array
          items:
            type: string
        confidence:
          type: number
        score:
          type: integer
        salience:
          type: string
          description: Numeric salience value serialized from PostgreSQL numeric.
        sensitivity:
          type: string
        type:
          type:
            - string
            - 'null'
        scope:
          type: string
        scope_key:
          type: [string, 'null']
        evidence:
          oneOf:
            - type: object
            - type: string
            - type: 'null'
        polarity:
          type: string
        status:
          type: string
          enum: [active, superseded, contradicted]
        valid_from:
          type:
            - string
            - 'null'
        valid_until:
          type:
            - string
            - 'null'
        source_timestamp:
          type:
            - string
            - 'null'
          format: date-time
          description: Original source conversation event time; distinct from memory creation time.
        archived_at:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
          description: Memory row creation or extraction time.
        updated_at:
          type: string
          format: date-time
        parent_id:
          type:
            - string
            - 'null'
          format: uuid
        volatility:
          type: string
        edge_count:
          type: integer

    RecallClient:
      type: object
      required:
        - name
        - version
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          allOf:
            - pattern: \S
            - pattern: ^[^\u0000-\u001f\u007f-\u009f\ud800-\udfff]*$
        version:
          type: string
          minLength: 1
          maxLength: 100
          allOf:
            - pattern: \S
            - pattern: ^[^\u0000-\u001f\u007f-\u009f\ud800-\udfff]*$
    RecallBundleResponse:
      type: object
      additionalProperties: false
      required: [schema_version, bundle]
      properties:
        schema_version:
          type: string
          const: persistio.recall_bundle.v3
        bundle:
          type: string
          description: Complete escaped context, at most the requested max_bundle_bytes in decoded UTF-8 bytes; may be empty.
    RecallJsonResponse:
      type: object
      required:
        - memories
        - related_memories
        - evidence_chunks
        - raw_chunks
      additionalProperties: false
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/RecallMemory"
        related_memories:
          type: array
          items:
            $ref: "#/components/schemas/RecallMemory"
        evidence_chunks:
          type: array
          items:
            $ref: "#/components/schemas/RecallChunk"
        raw_chunks:
          type: array
          items:
            $ref: "#/components/schemas/RecallRawChunk"
    RecallMemory:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            similarity:
              type: [number, 'null']
            source:
              type: string
              enum: [semantic, graph]
            edge_type:
              type:
                - string
                - 'null'
            revision:
              type: string
              pattern: '^[1-9][0-9]*$'
            source_chunks:
              type: array
              items: {type: string, format: uuid}
            unresolved_conflict:
              type: boolean
    RecallChunk:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
          description: Original conversation turn timestamp.
    RecallRawChunk:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
          description: Original conversation turn timestamp.
    MemoryEdgeType:
      type: string
      enum: [applies_to, part_of, depends_on, supports, contradicts, supersedes, refines, relevant_when]
    MemoryGraphNode:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            depth:
              type: integer
    MemoryGraphEdge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        from_memory_id:
          type: string
          format: uuid
        to_memory_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/MemoryEdgeType'
        confidence:
          type: number
        reason:
          type:
            - string
            - 'null'
        created_at:
          type: string
        updated_at:
          type: string
    MemoryGraph:
      type: object
      properties:
        seed_memory_id:
          type:
            - string
            - 'null'
          format: uuid
        depth:
          type: integer
        limit:
          type: integer
        direction:
          type: string
          enum: [out, in, both]
        edge_types:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/MemoryEdgeType'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/MemoryGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/MemoryGraphEdge'
    CurationStatus:
      type: object
      properties:
        vault_id:
          type: string
          format: uuid
        plan:
          type: string
        period:
          type: string
          example: '2026-05'
        limits:
          type: object
          additionalProperties: true
        usage:
          type: object
          properties:
            curator_runs:
              type: integer
            curator_requests:
              type: integer
            curator_input_tokens:
              type: integer
            curator_output_tokens:
              type: integer
            curator_candidates_processed:
              type: integer
            curator_candidates_deferred:
              type: integer
        backlog:
          type: object
          properties:
            pending_queue_rows:
              type: integer
            oldest_queue_age_seconds:
              type: integer
              nullable: true
            backlog_limit:
              type: integer
            pressure:
              type: string
              enum: [ok, warning, over_limit]
        schedule:
          type: object
          properties:
            last_run_at:
              type: string
              nullable: true
            next_run_at:
              type: string
              nullable: true
            eligible_now:
              type: boolean
            defer_reason:
              type: string
              nullable: true
        recent_runs:
          type: array
          items:
            type: object
            properties:
              segment_id:
                type: [string, 'null']
                format: uuid
              triggered_at:
                type: string
                format: date-time
              actions:
                type: integer
              applied_actions:
                type: integer
              errors:
                type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
