services:
  persistio:
    image: persistio:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      STORAGE_EMBEDDING_DIMENSIONS: ${STORAGE_EMBEDDING_DIMENSIONS:-1024}
